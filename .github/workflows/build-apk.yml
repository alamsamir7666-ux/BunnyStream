name: Build APK

# BunnyStream (CloudStream fork, phone-only) APK builder.
# Self-contained: needs NO organisation secrets. Optional secrets:
#   KEYSTORE_BASE64     base64 of a .jks/.keystore file (stable signing across builds)
#   KEYSTORE_PASSWORD   password of that keystore
#   KEY_ALIAS            key alias inside the keystore
#   KEY_PASSWORD         password of that key
# If KEYSTORE_BASE64 is absent an ephemeral keystore is generated per run
# (APK is still signed and installable, but each build has a new signature).
# Optional API keys (empty = feature disabled, app still builds fine):
#   SIMKL_CLIENT_ID, SIMKL_CLIENT_SECRET, TRAKT_CLIENT_ID,
#   MDL_API_KEY, MAL_KEY, ANILIST_KEY

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    # NOTE: no paths-ignore here. Path filters can suppress workflows for
    # tag pushes that point at already-pushed commits, which would silently
    # skip the stable release build. Every push simply builds.
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug is auto-signed with the debug key)'
        required: false
        default: 'release'
        type: choice
        options: [ release, debug ]

permissions:
  contents: write   # required to create GitHub Releases on v* tags

concurrency:
  group: "build-apk-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build BunnyStream APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # build.gradle.kts reads the keystore from the first file in
      #   $user.home/work/_temp/keystore/  ==  $RUNNER_TEMP/keystore/
      - name: Restore signing keystore (from secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          if [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "::error::KEYSTORE_BASE64 is set, but KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD are incomplete. Add all four secrets, or remove KEYSTORE_BASE64 to use an ephemeral keystore."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/keystore/bunnystream.keystore"
          {
            echo "SIGNING_KEY_ALIAS=${KEY_ALIAS}"
            echo "SIGNING_KEY_PASSWORD=${KEY_PASSWORD}"
            echo "SIGNING_STORE_PASSWORD=${KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Generate ephemeral signing keystore
        if: env.KEYSTORE_BASE64 == ''
        run: |
          mkdir -p "${RUNNER_TEMP}/keystore"
          KEYSTORE_PW="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/keystore/bunnystream.keystore" \
            -alias bunnystream -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "${KEYSTORE_PW}" -keypass "${KEYSTORE_PW}" \
            -dname "CN=BunnyStream, OU=Mobile, O=BunnyStream, L=Dhaka, C=BD" >/dev/null 2>&1
          {
            echo "SIGNING_KEY_ALIAS=bunnystream"
            echo "SIGNING_KEY_PASSWORD=${KEYSTORE_PW}"
            echo "SIGNING_STORE_PASSWORD=${KEYSTORE_PW}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tagged push -> STABLE flavor release: clean package id and the
            # plain catalog version name (e.g. 4.8.0, no -PRE suffix).
            echo "FLAVOR=stable"        >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release"   >> "$GITHUB_ENV"
            ./gradlew assembleStableRelease --stacktrace
            echo "APK_DIR=app/build/outputs/apk/stable/release" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_type }}" = "debug" ]; then
            echo "FLAVOR=prerelease"    >> "$GITHUB_ENV"
            echo "BUILD_TYPE=debug"     >> "$GITHUB_ENV"
            ./gradlew assemblePrereleaseDebug --stacktrace
            echo "APK_DIR=app/build/outputs/apk/prerelease/debug" >> "$GITHUB_ENV"
          else
            echo "FLAVOR=prerelease"    >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release"   >> "$GITHUB_ENV"
            ./gradlew assemblePrereleaseRelease --stacktrace
            echo "APK_DIR=app/build/outputs/apk/prerelease/release" >> "$GITHUB_ENV"
          fi
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

      - name: Rename APK
        id: rename
        run: |
          VERSION_NAME="$(grep -E '^versionName' gradle/libs.versions.toml | head -1 | cut -d'"' -f2)"
          SHA="$(git rev-parse --short HEAD)"
          SRC="$(ls "${APK_DIR}"/*.apk | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            OUT="BunnyStream-v${VERSION_NAME}-stable-${SHA}.apk"
          else
            OUT="BunnyStream-v${VERSION_NAME}-${BUILD_TYPE}-${SHA}.apk"
          fi
          mv "${SRC}" "${APK_DIR}/${OUT}"
          echo "apk=${APK_DIR}/${OUT}" >> "$GITHUB_OUTPUT"
          echo "### :package: Build output" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | \`$(basename "${APK_DIR}/${OUT}")\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flavor | ${FLAVOR} / ${BUILD_TYPE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${VERSION_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(du -h "${APK_DIR}/${OUT}" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`$(sha256sum "${APK_DIR}/${OUT}" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunnyStream-APK-r${{ github.run_number }}
          path: ${{ steps.rename.outputs.apk }}
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BunnyStream v${{ github.ref_name }} (stable)
          generate_release_notes: true
          files: ${{ steps.rename.outputs.apk }}
